workflow: ai-work-index
description: Dual-directory documentation structure for efficient AI task execution

context: |
  You are working with Caret's dual-directory architecture:
  - .agents/ (AI용): Token-optimized, English
    - context/*.md,*.json,*.yaml: Quick references (50-80 lines)
    - workflows/*.md: Detailed procedures (100-250 lines)
    - workflows/atoms/*.md: Reusable building blocks
  - .users/ (사람용): Detailed explanations in Korean
    - context/*.md: Human-readable guides (mirrors .agents/context/)
  - careti-docs/development/*.md: Developer guides in Korean

steps:
  - step: 1
    title: Analyze Work Nature
    duration: 30 seconds
    action: Extract keywords from user request to categorize work

    categories:
      - name: AI Feature Development
        keywords: [AI, feature, integration, system prompt, chatbot, agent, conversation]
        root: .agents/context/ai-feature.md              # Quick reference (60 lines)
        workflow: .agents/workflows/ai-feature.md # Detailed procedure (245 lines)
        korean: careti-docs/development/ai-feature.md  # Korean guide

      - name: AI Work Protocol
        keywords: [work protocol, phase, TDD, verification, documentation review]
        root: .agents/context/ai-work-protocol.md        # Quick reference (64 lines)
        workflow: .agents/workflows/ai-work-protocol.md # Detailed (104 lines)

      - name: Architecture & Design
        keywords: [architecture, design, structure, system, scaling, fork, Cline modification]
        root:
          - .agents/context/careti-architecture-guide.md  # Quick reference
          - .agents/context/architecture-guide.yaml      # Ultra-quick
        korean: careti-docs/development/careti-architecture-and-implementation-guide.md

      - name: Caret Development Workflow
        keywords: [caret development, development workflow, TDD, document-driven]
        root: .agents/context/careti-development.md       # Quick reference (68 lines)
        workflow: .agents/workflows/careti-development.md # Detailed (129 lines)

      - name: Cline Original Modification
        keywords: [Cline modification, source change, src/ directory, L1 L2 L3, proto]
        root: .agents/context/cline-modification.md      # Quick reference (78 lines)
        workflow: .agents/workflows/cline-modification.md # Detailed (146 lines)
        note: Always follow backup + `// CARETI MODIFICATION:` comment requirements

      - name: Critical Verification
        keywords: [verification, critical analysis, 3-stage, balanced review]
        root: .agents/context/critical-verification.md   # Quick reference (53 lines)
        workflow: .agents/workflows/critical-verification.md # Detailed (93 lines)

      - name: Document Organization
        keywords: [documentation, knowledge sync, atomization, F11, 1:1 parity]
        root: .agents/context/document-organization.md   # Quick reference (47 lines)
        workflow: .agents/workflows/document-organization.md # Detailed (100 lines)
        korean: careti-docs/development/documentation-guide.md

      - name: Merge Strategy
        keywords: [merge, fork, L1 L2 L3, Cline integration, upstream]
        root: .agents/context/merge-strategy.md          # Quick reference (51 lines)
        workflow: .agents/workflows/merge-strategy.md # Detailed (87 lines)

      - name: New Component Creation
        keywords: [component, React, new feature, UI, service, TDD]
        root: .agents/context/new-component.md           # Quick reference (80 lines)
        workflow: .agents/workflows/new-component.md # Detailed (180 lines)
        korean: careti-docs/development/component-architecture-principles.md

      - name: Testing & Quality
        keywords: [test, TDD, quality, coverage, verification, bug, integration test]
        root: .agents/context/testing-work.md            # Quick reference (82 lines)
        workflow:
          - .agents/workflows/testing-work.md # Detailed (253 lines)
          - .agents/workflows/testing-guide.md # AI testing guide
        korean: careti-docs/development/testing-guide.md
        commands:
          - npm run test:report      # Full test summary
          - npm run test:report:json # JSON for AI parsing
          - npm run test:unit        # Backend tests (mocha)
          - npm run test:webview     # Frontend tests (vitest)

      - name: API Provider Testing
        keywords: [API, provider, test script, LLM, streaming, integration test, Upstage, GLM, Gemini]
        root: .agents/context/api-provider-testing.yaml  # Quick reference
        korean: .users/context/api-provider-testing.md   # Korean guide
        docs: docs/API_TEST_GUIDE.md                     # Detailed guide

      - name: B2B Branding & Conversion
        keywords: [b2b, brand, codecenter, conversion, slexn]
        root: .agents/context/b2b-branding-workflow.md
        workflow: .agents/workflows/branding-and-logging.md # Branding implementation (157 lines)
        korean: careti-docs/development/b2b-branding-workflow.md

      - name: i18n Static Translation Fix
        keywords: [i18n, translation, static, dynamic, language switching, sovereign cloud, multilingual]
        workflow: .agents/workflows/i18n-static-translation-fix.md # i18n bug fix (158 lines)
        notes: |
          Sovereign Cloud: 7 languages (en, ko, ja, zh, fr, de, ru)
          Provider Country = UI Language Support

      - name: Frontend-Backend Communication
        keywords: [webview, communication, state management, message passing, UI integration, gRPC]
        root:
          - .agents/context/frontend-backend-patterns.md
          - .agents/context/webview-communication.md
        korean:
          - careti-docs/development/frontend-backend-interaction-patterns.md
          - careti-docs/development/webview-extension-communication.md

      - name: AI System Development
        keywords: [AI, message, system prompt, chatbot, agent, model, provider]
        root:
          - .agents/context/system-prompt.md
          - .agents/context/message-processing.md
        korean:
          - careti-docs/development/system-prompt-implementation.md
          - careti-docs/development/message-processing-architecture.md

      - name: UI/UX Development
        keywords: [UI, UX, persona, multilingual, i18n, button, interaction, link management]
        root: .agents/context/component-architecture.md
        korean:
          - careti-docs/development/component-architecture-principles.md
          - careti-docs/development/link-management-guide.md

      - name: Development Tools
        keywords: [utility, tool, file handling, image, link, build, storage, flow]
        root: .agents/context/build-system.md
        korean:
          - careti-docs/development/utilities.md
          - careti-docs/development/file-storage-and-image-loading-guide.md
          - careti-docs/development/ui-to-storage-flow.md

      - name: Desktop App (Tauri)
        keywords: [desktop, tauri, standalone app, rust, avatar, independent]
        root: desktop/README.md
        structure:
          frontend: desktop/src/
          backend: desktop/src-tauri/
        commands:
          - cd desktop && npm install
          - npm run tauri dev      # 개발 모드
          - npm run tauri build    # 프로덕션 빌드
        notes: |
          VS Code 없이 독립 실행 가능한 데스크톱 앱
          L1_independent 레벨 (자유롭게 수정 가능)

  - step: 2
    title: Smart Reading Strategy
    duration: 5-10 minutes
    priorities:
      high: Direct relevance (1-2 docs max)
      medium: Indirect relevance (scan only if needed)
      low: Reference docs (check links only)

  - step: 3
    title: Essential Pre-Work Checks
    checklist:
      - .agents/context file modification checklist confirmed
      - TDD principle (Red → Green → Refactor) understood
      - Backup creation plan (for Cline original modifications)
      - CARETI MODIFICATION comment plan (for Cline original modifications)

  - step: 4
    title: Next Step
    action: After document selection and reading, use /ai-work-protocol for detailed phase-based implementation approach

guidelines:
  - Optimizes AI context usage by selecting only relevant documents based on work nature keywords
  - Goal is maximum efficiency with minimal context usage
  - Read only what's necessary for the specific task
  - Always follow the sequence: work analysis → document selection → focused reading → protocol execution
