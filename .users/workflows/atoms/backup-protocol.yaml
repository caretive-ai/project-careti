workflow: backup-protocol
category: atom
description: Cline 원본 파일 수정 시 파일 백업 절차

context: Cline 원본 파일을 수정하고 백업이 필요한 상황입니다.

currentMethod:
  backup:
    required: false
    deprecated: true
    note: "새 .cline 백업을 생성하지 마세요. git 히스토리 + CARETI MODIFICATION 주석을 사용하세요."
  comment:
    required: true
    format: "// CARETI MODIFICATION: [명확한 설명]"

protectedDirectories:
  - src/
  - webview-ui/
  - proto/
  - scripts/
  - evals/
  - docs/
  - locales/
  - root configs/

modificationRules:
  - 파일이 보호된 디렉토리에 있는지 확인
  - 변경 전 CARETI MODIFICATION 주석 추가
  - 변경을 최소로 유지 (파일당 최대 1-3줄)
  - 절대 기존 코드를 주석 처리하지 않고 완전히 교체
  - 변경 후 컴파일 검증 (npm run compile)

examples:
  - file: src/extension.ts
    code: |
      // CARETI MODIFICATION: Caret 래퍼 초기화
      const caretWrapper = new CaretProviderWrapper(context);

  - file: src/core/controller/index.ts
    code: |
      // CARETI MODIFICATION: Caret gRPC 핸들러 추가
      await setupCaretGrpcHandlers(this);

relatedWorkflows: [modification-levels, comment-protocol, verification-steps]

guidelines:
  - 백업 프로토콜이 주석 전용 접근 방식으로 단순화됨
  - Cline 코어에 대한 최소 침습적 변경에 집중
  - 수정 후 항상 컴파일 검증

mirroringPolicy: 이 파일 수정 시 .agents/workflows/atoms/backup-protocol.yaml도 동일하게 업데이트
