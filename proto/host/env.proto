syntax = "proto3";

package caret;
option java_package = "bot.caret.proto";
option java_multiple_files = true;

import "cline/common.proto";

// Provides methods for working with the user's environment.
service EnvService {
  // Writes text to the system clipboard.
  rpc clipboardWriteText(caret.StringRequest) returns (caret.Empty);

  // Reads text from the system clipboard.
  rpc clipboardReadText(caret.EmptyRequest) returns (caret.String);
}
